            { name: "마황승마탕", herbs: ["마황", "승마", "당귀", "지모", "황금", "위유", "작약", "천문동", "계지", "복령", "감초", "석고", "백출", "건강"] },

            { name: "이중환", herbs: ["인삼", "건강", "감초", "백출"] },
            { name: "통맥회역가저담즙탕", herbs: ["감초", "건강", "부자", "저담즙"] },
            { name: "소곤산", herbs: ["속옷"] },
            { name: "지실치자탕", herbs: ["지실", "치자", "향시"] },
            { name: "모려택사산", herbs: ["모려", "택사", "촉칠", "정력자", "상륙근", "해조", "과루근"] },
            { name: "죽엽석고탕", herbs: ["죽엽", "석고", "반하", "맥문동", "인삼", "감초", "갱미"] }
        ];

        window.onload = function() {
            startTurn();
        };

        function startTurn() {
            document.getElementById('round-display').innerText = `Round ${currentRound}`;
            document.getElementById('result').innerHTML = `제시된 본초들로 만들 수 있는 <strong>가장 본초 수가 많은 처방</strong>을 완성해야 다음 턴이 열립니다!`;
            document.getElementById('result').style.color = "#333";
            document.getElementById('answer-key').style.display = 'none';

            // 버튼 초기화 (잠금)
            const nextBtn = document.getElementById('btn-next');
            nextBtn.disabled = true;
            nextBtn.innerHTML = "🔒 다음 턴 (잠김)";

            // 이미 출제된 처방 필터링
            let availableFormulas = formulaDB.filter(f => !usedBases.includes(f.name));
            
            // 모든 처방을 한 번씩 다 풀었다면 출제 기록 초기화
            if (availableFormulas.length === 0) {
                usedBases = [];
                availableFormulas = formulaDB;
                alert("축하합니다! 113개 처방을 모두 한 바퀴 도셨습니다. 다시 첫 문제부터 시작합니다.");
            }

            // 1. 기준 처방 뽑기 및 기록
            const randomBase = availableFormulas[Math.floor(Math.random() * availableFormulas.length)];
            usedBases.push(randomBase.name); // 뽑힌 처방을 기록에 추가
            
            let pool = new Set(randomBase.herbs);

            // 2. 오매환, 마황승마탕 등 큰 처방을 위한 다이나믹 풀 사이즈 조절 (최소 10개, 기본 처방길이 + 함정 3~4개)
            let targetPoolSize = Math.max(10, pool.size + 3);

            let availableHerbs = allHerbs.filter(h => !pool.has(h));
            availableHerbs.sort(() => Math.random() - 0.5);
            
            let i = 0;
            while(pool.size < targetPoolSize && i < availableHerbs.length) {
                pool.add(availableHerbs[i]);
                i++;
            }

            const herbArray = Array.from(pool).sort(() => Math.random() - 0.5);
            const listDiv = document.getElementById('herb-list');
            const cauldronDiv = document.getElementById('cauldron');
            
            listDiv.innerHTML = '<div class="zone-title">🌱 본초</div>';
            cauldronDiv.innerHTML = '<div class="zone-title">🍲 가마솥</div>';

            herbArray.forEach((herb, index) => {
                let div = document.createElement('div');
                div.className = 'herb';
                div.id = 'herb_' + index;
                div.draggable = true;
                div.innerText = herb;
                div.ondragstart = drag;
                div.onclick = toggleLocation;
                listDiv.appendChild(div);
            });

            // 정답지 및 목표 처방 세팅 로직
            currentAnswers = [];
            maxHerbCount = 0;
            targetFormulas = [];

            formulaDB.forEach(f => {
                if (f.herbs.every(h => pool.has(h))) {
                    currentAnswers.push({ name: f.name, herbs: f.herbs });
                    if (f.herbs.length > maxHerbCount) {
                        maxHerbCount = f.herbs.length;
                    }
                }
            });

            currentAnswers.forEach(f => {
                if (f.herbs.length === maxHerbCount) {
                    targetFormulas.push(f.name);
                }
            });
        }

        function nextTurn() {
            currentRound++;
            startTurn();
        }

        function toggleAnswer() {
            const answerDiv = document.getElementById('answer-key');
            if (answerDiv.style.display === 'none' || answerDiv.style.display === '') {
                answerDiv.style.display = 'block';
                
                let answerHTML = `<strong>💡 정답지 (현재 본초로 가능한 처방들):</strong><br>`;
                
                // 처방들을 본초 개수 내림차순으로 정렬
                let sortedAnswers = [...currentAnswers].sort((a, b) => b.herbs.length - a.herbs.length);

                sortedAnswers.forEach(f => {
                    let isTarget = targetFormulas.includes(f.name);
                    let titleStr = isTarget ? `<span class="highlight-target">👑 ${f.name} (목표)</span>` : `<strong>${f.name}</strong>`;
                    let herbsStr = `<span style="color:#555;">[${f.herbs.length}미] ${f.herbs.join(', ')}</span>`;
                    answerHTML += ` - ${titleStr} <br>&nbsp;&nbsp;&nbsp; ${herbsStr}<br>`;
                });
                
                answerDiv.innerHTML = answerHTML;
            } else {
                answerDiv.style.display = 'none';
            }
        }

        function toggleLocation(ev) {
            const herb = ev.target;
            const list = document.getElementById('herb-list');
            const cauldron = document.getElementById('cauldron');
            
            if (herb.parentElement.id === 'herb-list') {
                cauldron.appendChild(herb);
            } else {
                list.appendChild(herb);
            }
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev, targetZone) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            var draggedElement = document.getElementById(data);
            
            let targetDiv = ev.target.closest('.zone');
            if(targetDiv) {
                targetDiv.appendChild(draggedElement);
            }
        }

        function checkFormula() {
            const cauldron = document.getElementById('cauldron');
            const herbsInCauldron = Array.from(cauldron.getElementsByClassName('herb')).map(h => h.innerText).sort();
            const resultDiv = document.getElementById('result');

            if (herbsInCauldron.length === 0) {
                resultDiv.innerText = "가마솥이 비어있습니다. 본초를 넣어주세요!";
                resultDiv.style.color = "#e67e22";
                return;
            }

            let foundFormulas = [];

            for (let formula of formulaDB) {
                let sortedFormulaHerbs = [...formula.herbs].sort();
                if (JSON.stringify(herbsInCauldron) === JSON.stringify(sortedFormulaHerbs)) {
                    foundFormulas.push(formula.name);
                }
            }

            if (foundFormulas.length > 0) {
                let isTargetMatch = foundFormulas.some(name => targetFormulas.includes(name));

                if (isTargetMatch) {
                    resultDiv.innerHTML = `🎉 대정답! 최고 난이도 처방(<strong>${foundFormulas.join(', ')}</strong>)을 맞추셨습니다! 다음 턴이 열렸습니다. 🎉`;
                    resultDiv.style.color = "#27ae60";
                    
                    const nextBtn = document.getElementById('btn-next');
                    nextBtn.disabled = false;
                    nextBtn.innerHTML = "⏭️ 다음 턴으로";
                } else {
                    resultDiv.innerHTML = `👍 올바른 처방입니다! (<strong>${foundFormulas.join(', ')}</strong>)<br>하지만 이번 턴의 <strong>가장 본초가 많은 처방(목표: ${maxHerbCount}미)</strong>을 찾아야 통과할 수 있습니다!`;
                    resultDiv.style.color = "#2980b9";
                }
            } else {
                resultDiv.innerText = "음... 이 조합에 해당하는 처방이 없거나 아직 데이터에 없습니다.";
                resultDiv.style.color = "#c0392b";
            }
        }
    </script>
